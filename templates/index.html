<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FraudGuard | Analyst Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const defaultForm = {
      amount: 2500,
      time: '14:30',
      device_change: false,
      location_change: false,
    };

    const levelClassMap = {
      Low: 'low',
      Medium: 'medium',
      High: 'high',
    };

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0,
      }).format(Number(value) || 0);
    }

    function TransactionForm({ form, setForm, onSubmit, isLoading, scenarios, whatIfEnabled, setWhatIfEnabled }) {
      const scenarioKeys = Object.keys(scenarios || {});

      const handleInputChange = (field, value) => {
        setForm((prev) => ({ ...prev, [field]: value }));
      };

      const applyScenario = (key) => {
        if (!key || !scenarios[key]) return;
        const s = scenarios[key];
        setForm({
          amount: s.amount,
          time: s.time,
          device_change: s.device_change,
          location_change: s.location_change,
        });
      };

      return (
        <section className="card input-card">
          <div className="card-header">
            <h2>Transaction Input</h2>
            <p>Capture key risk signals before scoring.</p>
          </div>

          <div className="field-group">
            <label>Scenario Template</label>
            <select onChange={(e) => applyScenario(e.target.value)} defaultValue="">
              <option value="">Select template (optional)</option>
              {scenarioKeys.map((key) => (
                <option key={key} value={key}>{scenarios[key].name}</option>
              ))}
            </select>
          </div>

          <div className="field-grid">
            <div className="field-group">
              <label>Amount</label>
              <input
                type="number"
                min="1"
                value={form.amount}
                onChange={(e) => handleInputChange('amount', Number(e.target.value))}
              />
            </div>

            <div className="field-group">
              <label>Time</label>
              <input
                type="time"
                value={form.time}
                onChange={(e) => handleInputChange('time', e.target.value)}
              />
            </div>
          </div>

          <div className="switch-grid">
            <label className="switch-card">
              <span>Device Changed</span>
              <input
                type="checkbox"
                checked={form.device_change}
                onChange={(e) => handleInputChange('device_change', e.target.checked)}
              />
            </label>
            <label className="switch-card">
              <span>Location Changed</span>
              <input
                type="checkbox"
                checked={form.location_change}
                onChange={(e) => handleInputChange('location_change', e.target.checked)}
              />
            </label>
          </div>

          <label className="what-if-toggle">
            <input
              type="checkbox"
              checked={whatIfEnabled}
              onChange={(e) => setWhatIfEnabled(e.target.checked)}
            />
            <span>What-if simulation (auto-refresh risk on input changes)</span>
          </label>

          <button className="analyze-btn" onClick={onSubmit} disabled={isLoading}>
            {isLoading ? 'Analyzing…' : 'Analyze Risk'}
          </button>
        </section>
      );
    }

    function RiskScoreCard({ riskLevel, riskScore }) {
      const levelClass = levelClassMap[riskLevel] || 'low';
      return (
        <section className="card">
          <div className="result-top">
            <div>
              <p className="kicker">Risk Score</p>
              <div className="score">{riskScore ?? '--'}</div>
            </div>
            <span className={`badge ${levelClass}`}>{riskLevel || 'Not Scored'}</span>
          </div>
          <div className="progress-track">
            <div className={`progress-fill ${levelClass}`} style={{ width: `${Math.max(0, Math.min(100, riskScore || 0))}%` }} />
          </div>
        </section>
      );
    }

    function SignalsList({ signals }) {
      return (
        <section className="card">
          <h3>Signals</h3>
          <ul className="list">
            {(signals?.length ? signals : ['Run analysis to view transaction signals.']).map((item, i) => (
              <li key={`${item}-${i}`}>{item}</li>
            ))}
          </ul>
        </section>
      );
    }

    function ExplanationPanel({ text, isLoading }) {
      return (
        <section className="card">
          <h3>LLM Explanation</h3>
          <p className="muted-block">{isLoading ? 'Generating analyst summary…' : (text || 'No explanation available yet.')}</p>
        </section>
      );
    }

    function ActionSuggestions({ actions }) {
      return (
        <section className="card">
          <h3>Action Suggestions</h3>
          <ul className="list">
            {(actions?.length ? actions : ['Await analysis to get decision recommendations.']).map((item, i) => (
              <li key={`${item}-${i}`}>{item}</li>
            ))}
          </ul>
        </section>
      );
    }

    function App() {
      const [positioning, setPositioning] = useState([]);
      const [form, setForm] = useState(defaultForm);
      const [scenarios, setScenarios] = useState({});
      const [result, setResult] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [whatIfEnabled, setWhatIfEnabled] = useState(false);

      const fetchScenarios = async () => {
        const res = await fetch('/api/scenarios');
        const data = await res.json();
        setScenarios(data.scenarios || {});
      };

      const fetchPositioning = async () => {
        const res = await fetch('/api/positioning');
        const data = await res.json();
        setPositioning(data.positioning || []);
      };

      const analyzeTransaction = async (nextPayload) => {
        const payload = nextPayload || form;
        setIsLoading(true);
        try {
          const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          setResult(data);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchPositioning();
        fetchScenarios();
        analyzeTransaction(defaultForm);
      }, []);

      useEffect(() => {
        if (!whatIfEnabled) return;
        const timer = setTimeout(() => analyzeTransaction(form), 320);
        return () => clearTimeout(timer);
      }, [form, whatIfEnabled]);

      const titleAmount = useMemo(() => formatCurrency(form.amount), [form.amount]);

      return (
        <main className="dashboard">
          <header className="page-header">
            <div>
              <h1>FraudGuard Analyst Console</h1>
              <p>Realtime transaction risk triage for fintech fraud operations.</p>
            </div>
            <div className="header-chip">Focused amount: {titleAmount}</div>
          </header>

          <section className="positioning-card">
            {positioning.length
              ? positioning.map((line, i) => <p key={i}>• {line}</p>)
              : <p>Loading product context…</p>}
          </section>

          <section className="dashboard-grid">
            <TransactionForm
              form={form}
              setForm={setForm}
              onSubmit={() => analyzeTransaction(form)}
              isLoading={isLoading}
              scenarios={scenarios}
              whatIfEnabled={whatIfEnabled}
              setWhatIfEnabled={setWhatIfEnabled}
            />

            <section className="results-stack">
              <RiskScoreCard riskLevel={result?.risk_level} riskScore={result?.risk_score} />
              <SignalsList signals={result?.signals} />
              <ExplanationPanel text={result?.explanation} isLoading={isLoading} />
              <ActionSuggestions actions={result?.actions} />
            </section>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
